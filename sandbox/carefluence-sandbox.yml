  login_url: https://core.carefluence.com/cf.admin.core/Account/Login
  approval_required: true
  approval_detail: >-
    "Once login, developer is able to register App and get the grants approved
    by the Carefluence Administration for token generation purposes."
    (published collection overview)
  keyless_access: false
  anonymous_endpoints:
  - url: https://classic.carefluence.com/r4/metadata
    status: 200
    note: CapabilityStatement is served without a token.
  - url: https://classic.carefluence.com/r4/.well-known/smart-configuration
    status: 200
  - url: https://core.carefluence.com/cf.admin.core/.well-known/openid-configuration
    status: 200

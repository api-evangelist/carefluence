aid: carefluence
name: Carefluence
description: >-
  Carefluence is a US health-IT interoperability vendor whose product is an
  ONC-certified, FHIR-based Open API platform that EHR, telehealth, remote
  patient monitoring, HIE and health-analytics vendors license to reach
  regulatory compliance and to exchange clinical data with other systems. The
  Carefluence Open API R4 was certified on 2022-06-29 under CHPL ID
  15.04.04.2657.Care.R4.01.0.220629 against ONC criteria 170.315 (d)(1,3,9-10,12-13)
  and (g)(4-7,9-10), including the § 170.315(g)(10) Standardized API for Patient
  and Population Services; the company states it was the first FHIR-based Open
  API product to earn ONC 2015 Edition certification, in July 2016, and was an
  early participant in the Argonaut Project. The platform is a FHIR R4 server
  (US Core IG v3.1.1, 24 resource types) fronted by a first-party SMART on FHIR
  OAuth 2.0 / OpenID Connect authorization server, with a data translator for
  HL7 v2 and C-CDA normalization, adapters for non-FHIR back ends, a built-in
  integration engine, an asynchronous FHIRops product, and an announced Model
  Context Protocol server for AI agents.

apis:
- aid: carefluence:openapi-r4
  name: Carefluence Open API R4
  description: >-
    The ONC-certified § 170.315(g)(10) Standardized API for Patient and
    Population Services. A HL7 FHIR R4 (4.0.1) RESTful server conforming to the
    US Core Implementation Guide v3.1.1, exposing 24 resource types — Patient,
    Encounter, Condition, AllergyIntolerance, MedicationRequest, Medication,
    MedicationStatement, Immunization, Procedure, Observation, DiagnosticReport,
    DocumentReference, CarePlan, CareTeam, Goal, Device, Provenance,
    Practitioner, Organization, Location, ServiceRequest, AuditEvent, Person and
    Group — in JSON or XML, secured with SMART on FHIR OAuth 2.0 bearer tokens.
    Group declares the FHIR Bulk Data group-export operation.
  image: https://carefluence.com/wp-content/uploads/2018/04/Logo-WHT-nds1740.png

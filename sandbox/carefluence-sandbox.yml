name: Carefluence Open API R4 developer test surface
description: >-
  Carefluence does not publish a keyless playground. What it does publish is a
  complete, runnable Postman collection wired to a live FHIR server whose saved
  example responses are Synthea-generated synthetic patients, plus a
  self-service developer registration path. Access to the live server requires a
  registered developer application whose grants Carefluence administration
  approves.

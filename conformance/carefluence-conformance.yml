- id: hl7v2-ccda-x12
  name: HL7 v2, C-CDA and EDI X12 ingestion
  conforms: claimed
  regime: healthcare
  evidence:
    detail: >-
      The provider states its integration engine and FHIR Transformer accept
      HL7 v2 messages and C-CDA documents and convert them to FHIR resources,

notes:
- >-
  Patient is the compartment root: 12 resource types declare a `patient` search
  parameter, and the SMART scope set is expressed per-resource inside the
  patient compartment (patient/<Resource>.read).
- >-
  Provenance, Practitioner, Organization and Location are the reference/directory
  entities; Location is the only resource with no write interaction at all.
- >-
  Group carries no interactions and no search parameters — it exists solely to
  host the bulk-data $export operation.
- >-
  Provenance and MedicationRequest declare a search parameter set of
  [_id, name, gender, birthdate], which is the Patient parameter set copied
  onto resources it does not apply to. Recorded as observed; it looks like a
  defect in the CapabilityStatement rather than a real capability.
- >-
  No Subscription resource is declared, so there is no FHIR-native event or
  webhook surface on this server.

findings:
- >-
  All three first-party packages are .NET-only. There is no JavaScript, Python,
  Java or Go client for a FHIR API whose buyers are health-IT developers.
- >-
  Newest first-party release is 2019-03-04. The certified R4 API dates from
  2022-06-29 and the MCP server product was announced later still; no package
  has been touched since. This is the strongest provider-published decay signal
  on the Carefluence surface.
- >-
  None of the three packages publishes a repository URL, licence URL or release
  notes, so a consumer cannot see what changed or read the source.

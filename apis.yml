- aid: carefluence:authorization-server
  name: Carefluence SMART on FHIR Authorization Server
  description: >-
    The first-party OpenID Connect / OAuth 2.0 authorization server that issues
    every token the Carefluence Open API R4 accepts, and the administration
    portal where developers register applications and request grants. Publishes
    full OpenID Connect discovery and a JWKS anonymously, supports PKCE (S256),
    RS256 ID tokens, front-channel and back-channel logout, token introspection
    and revocation, and advertises 51 distinct SMART on FHIR scopes across the
    patient, user and system compartments.
  image: https://carefluence.com/wp-content/uploads/2018/04/Logo-WHT-nds1740.png
